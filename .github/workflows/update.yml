name: Auto Update All Playlists

on:
  schedule:
    - cron: '* * * * *' # প্রতি মিনিটে চেক করবে
  workflow_dispatch:

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Process All M3U
        run: |
          CHANGES_DETECTED=false
          BD_TIME=$(TZ='Asia/Dhaka' date +'%Y-%m-%d %H:%M:%S')

          process_playlist() {
            local NAME=$1
            local URL=$2
            local OUT_FILE=$3
            local TEMP_FILE="temp_${NAME}.m3u"
            local NEW_PAYLOAD="new_payload_${NAME}.txt"
            local OLD_PAYLOAD="old_payload_${NAME}.txt"

            # নতুন ফাইল ডাউনলোড
            curl -s -L -o "$TEMP_FILE" "$URL"
            
            # নতুন ফাইল থেকে হেডার বাদে মূল চ্যানেল লিংকগুলো আলাদা করা হচ্ছে
            grep -v -i "^#EXTM3U" "$TEMP_FILE" | grep "\S" > "$NEW_PAYLOAD" || true

            # গিটহাবে থাকা আগের ফাইল থেকে আমাদের বানানো হেডার সরিয়ে মূল চ্যানেলগুলো বের করা হচ্ছে
            if [ -f "$OUT_FILE" ]; then
              grep -v -E "^#=================================|^#.*Developed by:|^#.*Telegram:|^#.*Last Updated:|^#.*Channels Count:|^#EXTM3U" "$OUT_FILE" | grep "\S" > "$OLD_PAYLOAD" || true
            else
              touch "$OLD_PAYLOAD"
            fi

            # তুলনা করা (আগের চ্যানেলের সাথে নতুন চ্যানেলের মিল আছে কিনা)
            if cmp -s "$NEW_PAYLOAD" "$OLD_PAYLOAD"; then
              echo "No changes in $NAME playlist."
            else
              echo "New code detected in $NAME! Updating..."
              CHANNEL_COUNT=$(grep -c -i "#EXTINF" "$TEMP_FILE" || echo 0)
              
              echo "#EXTM3U" > "$OUT_FILE"
              echo "#=================================" >> "$OUT_FILE"
              echo "# 🖥️ Developed by: S.A.Emon" >> "$OUT_FILE"
              echo "# 🔗 Telegram: https://t.me/Obiram_tv" >> "$OUT_FILE"
              echo "# 🕒 Last Updated: $BD_TIME (BD Time)" >> "$OUT_FILE"
              echo "# 📺 Channels Count: $CHANNEL_COUNT" >> "$OUT_FILE"
              echo "#=================================" >> "$OUT_FILE"
              cat "$NEW_PAYLOAD" >> "$OUT_FILE"
              
              CHANGES_DETECTED=true
            fi
          }

          # ==========================================
          # ৪টি লিংক প্রসেস করা হচ্ছে
          # ==========================================
          process_playlist "akash" "https://akashgo-obiramtv.emonsa4.workers.dev/akash_secret_list_v1.m3u" "akash_playlist.m3u"
          process_playlist "toffee" "https://toffee-obiramtv.emonsa4.workers.dev/obiram_secret_list_v1.m3u" "toffee_playlist.m3u"
          process_playlist "ay" "https://ay-obiram.emonsa4.workers.dev/akash_secret_list_v1.m3u" "ay_playlist.m3u"
          process_playlist "roar" "https://roar-obiram.emonsa4.workers.dev/obiram-vip-data" "roar_playlist.m3u"

          # ==========================================
          # গিটহাবে শুধু মেইন ৪টি ফাইল সেভ করা হবে
          # ==========================================
          if [ "$CHANGES_DETECTED" = true ]; then
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            
            # আগের তৈরি হওয়া .raw_ ফাইলগুলো গিটহাব থেকে ডিলিট করে দেওয়া হচ্ছে (যাতে আর কখনো না দেখায়)
            git rm --cached .raw_*.m3u 2>/dev/null || true
            
            # শুধু আসল ৪টি ফাইল গিটহাবে যোগ করা হচ্ছে
            git add *_playlist.m3u
            git commit -m "Auto-updated playlists at $BD_TIME"
            git push
            echo "Successfully pushed updates to GitHub!"
          else
            echo "No updates required for any playlist. Skipping push."
          fi
